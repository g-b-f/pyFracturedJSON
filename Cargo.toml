[package]
name = "pyfracturedjson"
version = "2.2.1"
edition = "2024"
license = "MIT"

[features]
default = ["abi3-py39"]
abi3-py39 = ["pyo3/abi3-py39"]
abi3-py314 = ["pyo3/abi3-py314"]

[lib]
name = "_rust_wrapper"
crate-type = ["cdylib"]

[dependencies]
fracturedjson = "0.1.1"

[dependencies.pyo3]
version = "0.29"
features = ["extension-module"]