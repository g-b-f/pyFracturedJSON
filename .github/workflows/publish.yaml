name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - dev
      - develop

jobs:
  publish:
    permissions:
      id-token: write
      contents: write
      attestations: write
    uses: g-b-f/workflows/.github/workflows/maturin_publish.yaml@master
    with:
      package-name: pyFracturedJSON
      smoke-test-script: |
        from fracturedjson import dumps

        expected="""{
            "abcd"     : "abcd",
            "long_list": [
                "thing_0",  "thing_1",  "thing_2",  "thing_3",  "thing_4",  "thing_5",  "thing_6",  "thing_7",  "thing_8",
                "thing_9",  "thing_10", "thing_11", "thing_12", "thing_13", "thing_14", "thing_15", "thing_16", "thing_17",
                "thing_18", "thing_19"
            ]
        }
        """
        long_list = [f"thing_{i}" for i in range(20)]
        actual = dumps({"abcd": "abcd", "long_list": long_list})
        assert actual == expected, f"unexpected format:\n\nexpected:\n{expected}\nactual:\n{actual}"
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
